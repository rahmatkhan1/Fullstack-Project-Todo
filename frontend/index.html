<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .todo-container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 350px;
    }

    .todo-container h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="todo-container">
    <h1>To-Do Page</h1>
    <form id="todoForm">
      <label for="itemName">Item Name</label>
      <input type="text" id="itemName" name="itemName" placeholder="Enter item name" required>

      <label for="itemDesc">Item Description</label>
      <textarea id="itemDesc" name="itemDesc" rows="4" placeholder="Enter item description" required></textarea>

      <button type="submit">Add To-Do</button>
    </form>
    <p id="responseMsg" style="color: green; font-weight: bold;"></p>
  </div>

  <script>
    const form = document.getElementById("todoForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const itemName = document.getElementById("itemName").value;
      const itemDescription = document.getElementById("itemDesc").value;

      const response = await fetch("http://localhost:5000/submittodoitem", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ itemName, itemDescription }),
      });

      const result = await response.json();
      document.getElementById("responseMsg").innerText = result.message;
      form.reset();
    });
  </script>
</body>
</html>
